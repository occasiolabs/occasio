name: 'Occasio Attest'
description: >-
  Produce a Sigstore-signed AI-Agent Behavioral Attestation for a Occasio
  session, upload it as a workflow artifact, and surface a GitHub Check Run
  on the PR with a human-readable summary.

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  run-id:
    description: >-
      Occasio run_id. If absent, the action reads it from
      ~/.occasio/session.json (the most recent proxy run on the runner).
    required: false
    default: ''
  chain-file:
    description: 'Path to pipeline-events.jsonl (default: ~/.occasio/pipeline-events.jsonl).'
    required: false
    default: ''
  policy-file:
    description: 'Path to policy.yml (default: ~/.occasio/policy.yml).'
    required: false
    default: ''
  sign:
    description: 'If "true", Sigstore-sign the attestation via GitHub OIDC.'
    required: false
    default: 'true'
  occasio-version:
    description: 'Version of @occasiolabs/occasio to install on the runner (default: latest).'
    required: false
    default: 'latest'
  github-token:
    description: 'Token used to create the Check Run. Defaults to the workflow GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  view-base-url:
    description: 'Base URL of the View-Evidence page. Used in the Check Run "Details" link.'
    required: false
    default: 'https://occasiolabs.github.io/attest-view'

outputs:
  bundle-path:
    description: 'Filesystem path to the single-file evidence bundle (run.occasio.json), verifiable with `occasio verify`'
    value: ${{ steps.attest.outputs.bundle-path }}
  attestation-path:
    description: 'Back-compat alias for bundle-path (same single file)'
    value: ${{ steps.attest.outputs.attestation-path }}
  check-run-url:
    description: 'URL of the created GitHub Check Run'
    value: ${{ steps.check.outputs.check-run-url }}
  rekor-entry:
    description: 'Rekor transparency log search URL (if Sigstore-signed)'
    value: ${{ steps.attest.outputs.rekor-entry }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install @occasiolabs/occasio
      shell: bash
      run: |
        npm install -g "@occasiolabs/occasio@${{ inputs.occasio-version }}"
        occasio --version || true

    - id: attest
      name: Produce signed attestation
      shell: bash
      env:
        OCC_INPUT_RUN_ID:     ${{ inputs.run-id }}
        OCC_INPUT_CHAIN:      ${{ inputs.chain-file }}
        OCC_INPUT_POLICY:     ${{ inputs.policy-file }}
        OCC_INPUT_SIGN:       ${{ inputs.sign }}
        OCC_GITHUB_SHA:       ${{ github.event.pull_request.head.sha || github.sha }}
        OCC_PR_NUMBER:        ${{ github.event.pull_request.number }}
      run: node ${{ github.action_path }}/scripts/run-attest.js

    # Self-verify the freshly-signed attestation before publishing it as an
    # artifact. Exercises the real-OIDC sign-and-verify round-trip end-to-end
    # in the same CI run — if Sigstore verification fails for any reason
    # (Rekor inclusion not yet propagated, cert chain mismatch, tampered
    # bundle), the action fails before the artifact reaches anyone who would
    # rely on it. Only runs when the attestation was actually signed
    # (inputs.sign == 'true'); unsigned attestations have nothing to verify.
    - name: Self-verify the signed evidence bundle (strict)
      if: inputs.sign == 'true' && steps.attest.outputs.bundle-path != ''
      shell: bash
      run: occasio verify --strict "${{ steps.attest.outputs.bundle-path }}"

    - name: Upload evidence bundle
      uses: actions/upload-artifact@v4
      with:
        name: occasio-evidence-bundle
        path: ${{ steps.attest.outputs.bundle-path }}
        if-no-files-found: error
        retention-days: 90

    - id: check
      name: Create Occasio Attested Check Run
      shell: bash
      env:
        GITHUB_TOKEN:        ${{ inputs.github-token }}
        GITHUB_REPOSITORY:   ${{ github.repository }}
        OCC_HEAD_SHA:         ${{ github.event.pull_request.head.sha || github.sha }}
        OCC_VIEW_BASE_URL:    ${{ inputs.view-base-url }}
        OCC_ATTESTATION_PATH: ${{ steps.attest.outputs.attestation-path }}
        OCC_BUNDLE_PATH:      ${{ steps.attest.outputs.bundle-path }}
        OCC_REKOR_ENTRY:      ${{ steps.attest.outputs.rekor-entry }}
      run: node ${{ github.action_path }}/scripts/post-check.js
